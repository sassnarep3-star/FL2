name: Availability snapshots

# Requirements served:
#  - "Snapshot the nfl.com injury report every Wed, Thu and Fri and keep a dated history"
#  - "Automate immutable multi-day availability snapshots ... with retained hashes"
#  - "Add durable snapshot storage and alerts ... monitor freshness and alert on source/schema changes"
#
# GATE F-T1 (session 8326a20d, fl2-dashboard/flagged-review.html): authorization remains
# unresolved. This workflow is inert unless repository variable FL2_NFL_CAPTURE_AUTHORIZED is
# explicitly set to the string "true" after the content-use review is closed. Manual dispatch
# is not treated as an exemption. The intended cadence is retained below as a comment only.

on:
  # schedule:
  #   - cron: "15 21 * * 3,4,5"   # reports publish ~16:00 ET Wed/Thu/Fri — ENABLE ONLY AFTER F-T1 IS RESOLVED
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    # Fail closed: no network request is made while the authorization variable is unset/false.
    if: ${{ vars.FL2_NFL_CAPTURE_AUTHORIZED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture official injury report (immutable, hash-stamped)
        run: python3 ops/availability_capture.py
      - name: Commit the new snapshot
        run: |
          git config user.name "fl2-availability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops/data/availability_snapshots/
          if git diff --cached --quiet; then
            echo "No change in the official report page snapshot."
          else
            git commit -m "availability snapshot $(date -u +%Y%m%dT%H%MZ) [automated]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Drift alarm (fail loudly on any structural change)
        run: python3 ops/drift_check.py
