name: verify site and data

# No build step exists — this workflow only proves the checks the repo makes about
# itself: the engine arithmetic, the data/registers' citation rules, and that every
# page and asset the site links to is actually served.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Engine self-test (every published "computed" figure comes from this run)
        run: python3 -m engine.selftest

      - name: Site + data audit (links, citations, register cross-references)
        run: python3 tools/check_site.py

      - name: Generated Markdown registers are current
        run: |
          python3 tools/gen_markdown.py --check || {
            echo "::error::generated registers are stale; run 'python3 tools/gen_markdown.py' and commit"; exit 1; }

      - name: Serve the site and fetch every page and asset
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/index.html >/dev/null && break; sleep 1; done
          python3 tools/serve_check.py http://127.0.0.1:8080/

      - name: Render test (needs jsdom; skipped if the registry is unreachable)
        run: |
          npm install --no-audit --no-fund --silent || { echo "npm install failed — skipping render test"; exit 0; }
          node tools/render_test.js
