name: Validate and publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned DOM-test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Validate decision-readiness register integrity and legacy crosswalk
        run: python3 scripts/check_readiness.py
      - name: Check readiness browser script syntax
        run: node --check assets/readiness.js
      - name: Exercise readiness table and review filters
        run: node scripts/test_readiness_ui.js
      - name: Validate rendered page DOM, links, and tables
        run: python3 engine/check_site.py
      - name: Validate pages, local links, and evidence rows
        run: python3 scripts/check_site.py
      - name: Rebuild and validate Week 10 data dashboard (docs/)
        run: |
          python3 scripts/make_pages.py
          python3 scripts/build_site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
